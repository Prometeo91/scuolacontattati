<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex"/>
  <title>Pagina non trovata · Scuola ContattaTi</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
  <style>
    /* Self-contained: nessuna dipendenza da style.css, funziona a qualsiasi profondità di URL */
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0d0b1a;color:#e8e0f0;text-align:center;padding:2rem;
      font-family:Georgia,'Times New Roman',serif;
      background-image:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(46,31,110,0.25) 0%, transparent 65%);
    }
    .wrap{max-width:480px}
    .seal{font-size:40px;color:#c9973a;margin-bottom:1.5rem;opacity:0.9}
    h1{font-size:clamp(64px,14vw,96px);font-weight:500;color:#e8c97a;line-height:1;letter-spacing:0.02em}
    .motto{font-size:14px;letter-spacing:0.22em;text-transform:uppercase;color:#c9973a;margin:1rem 0 1.75rem}
    p{font-size:17px;line-height:1.7;color:#c4b8d0;margin-bottom:0.5rem}
    p.en{font-size:15px;font-style:italic;opacity:0.75;margin-bottom:2rem}
    a.home{
      display:inline-block;padding:0.8rem 2.2rem;border:1px solid #c9973a;border-radius:999px;
      color:#e8c97a;text-decoration:none;font-size:16px;letter-spacing:0.04em;
      transition:background .3s ease,color .3s ease;
    }
    a.home:hover{background:#c9973a;color:#1a1000}
    .quote{margin-top:2.5rem;font-size:14px;font-style:italic;color:#c4b8d0;opacity:0.7;line-height:1.6}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="seal" aria-hidden="true">✶</div>
    <h1>404</h1>
    <p class="motto">Pagina non trovata</p>
    <p>La pagina che cerchi non esiste o è stata spostata.</p>
    <p class="en">The page you are looking for does not exist or has been moved.</p>
    <a class="home" href="/">Torna alla Home · Back to Home</a>
    <p class="quote">"Non tutti quelli che vagano sono perduti."</p>
  </div>
</body>
</html>
