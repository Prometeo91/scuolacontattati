<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0d0b1a" id="metaThemeColor" />
  <meta name="description" content="La Porta del Mago — un gioco iniziatico bilingue tratto dagli scritti di Salvatore Brizzi. Scuola ContattaTi." />
  <title>La Porta del Mago · Scuola ContattaTi</title>

  <!-- Anti-flash: applica tema e lingua salvati prima del render -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('sctheme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
          var m = document.getElementById('metaThemeColor');
          if (m) m.setAttribute('content', '#f5f0e8');
        }
        var lg = localStorage.getItem('sc-lang');
        document.documentElement.setAttribute('lang', lg === 'en' ? 'en' : 'it');
      } catch (e) {}
    })();
  </script>

  <!-- Font self-hosted (stessi woff2 del sito, in ../fonts/). I preload sono
       omessi: in preview la cartella ../fonts/ non esiste e il browser ricade
       sui fallback con metriche corrette definiti in fonts.css. -->
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#0d0b1a" />
      <rect x="35" y="28" width="30" height="50" rx="15" fill="none" stroke="#3a342a" stroke-width="1.4" />
      <rect x="40" y="33" width="20" height="45" rx="10" fill="none" stroke="#c9973a" stroke-width="1.4" />
      <circle cx="50" cy="50" r="6" fill="#e8c97a" />
      <circle cx="50" cy="50" r="13" fill="none" stroke="#c0392b" stroke-width="1" opacity="0.7" />
    </svg>
  </template>

  <header class="topbar">
    <a class="brand" id="brandLink" href="../index.html" title="Torna al sito">
      <span class="brand-seal" aria-hidden="true">✶</span>
      <span class="brand-text">
        <span class="brand-school" id="brandSchool">Scuola ContattaTi</span>
        <span class="brand-game" id="brandGame">La Porta del Mago</span>
      </span>
    </a>
    <div class="topbar-right">
      <span class="lang-pill" role="group" aria-label="Lingua / Language">
        <button type="button" data-lang="it" class="active">IT</button>
        <span class="lang-dot">·</span>
        <button type="button" data-lang="en">EN</button>
      </span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambia tema">
        <span class="ico" aria-hidden="true">☀</span><span class="lbl">Tema chiaro</span>
      </button>
    </div>
  </header>

  <main class="stage"><div id="app"></div></main>

  <script src="data.js"></script>
  <script src="i18n.js"></script>
  <script src="game.js"></script>
</body>
</html>
